# TuneGuesser stack for Portainer (its own stack).
# tuneguesser-web    : NGINX. Serves the built client from ./www, proxies /api and /ws.
# tuneguesser-server-a / -b : Node game servers (a single bundled file, no node_modules needed). Blue/green: a deploy goes to the
#   idle one, then NGINX is told to send new rooms there; running rooms stay on the old one until they finish (tools/deploy-nas.mjs).

services:
  web:
    image: nginx:1.27-alpine
    container_name: tuneguesser-web
    restart: unless-stopped
    ports:
      - "8087:80"
    command: ["nginx", "-c", "/etc/nginx/tg/nginx.conf", "-g", "daemon off;"]
    volumes:
      - /volume1/docker/tuneguesser/nginx:/etc/nginx/tg:ro # nginx.conf + active.conf (which server takes new rooms)
      - /volume1/docker/tuneguesser/www:/usr/share/nginx/html:ro
    networks:
      - tuneguesser
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

  server-a:
    image: node:22-slim
    container_name: tuneguesser-server-a
    restart: unless-stopped
    working_dir: /app
    command: node server.mjs
    environment:
      - NODE_ENV=production
      - PORT=3000
      - SLOT=a
      # Set these in Portainer (Stack > Environment variables), never in the repo
      - DATA_DIR=/data
      - SPOTIFY_CLIENT_ID=${SPOTIFY_CLIENT_ID:-}
      - YOUTUBE_API_KEY=${YOUTUBE_API_KEY:-}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - SPOTIFY_REDIRECT_URI=${SPOTIFY_REDIRECT_URI:-}
    volumes:
      - /volume1/docker/tuneguesser/server-a:/app:ro
      - /volume1/docker/tuneguesser/data:/data # Spotify logins (refresh tokens) survive restarts; shared by both slots
    networks:
      - tuneguesser

  server-b:
    image: node:22-slim
    container_name: tuneguesser-server-b
    restart: unless-stopped
    working_dir: /app
    command: node server.mjs
    environment:
      - NODE_ENV=production
      - PORT=3000
      - SLOT=b
      # Set these in Portainer (Stack > Environment variables), never in the repo
      - DATA_DIR=/data
      - SPOTIFY_CLIENT_ID=${SPOTIFY_CLIENT_ID:-}
      - YOUTUBE_API_KEY=${YOUTUBE_API_KEY:-}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - SPOTIFY_REDIRECT_URI=${SPOTIFY_REDIRECT_URI:-}
    volumes:
      - /volume1/docker/tuneguesser/server-b:/app:ro
      - /volume1/docker/tuneguesser/data:/data # Spotify logins (refresh tokens) survive restarts; shared by both slots
    networks:
      - tuneguesser

networks:
  tuneguesser:
    name: tuneguesser
