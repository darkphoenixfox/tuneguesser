worker_processes auto;
events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Docker DNS: NGINX starts even if the server container doesn't exist yet
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Blue/green: two game servers (a, b). active.conf (written by the deploy script) says which one takes NEW rooms;
    # a room's code starts with A-M (server a) or N-Z (server b), so its WebSocket (?room=CODE) goes to the server that owns it.
    include /etc/nginx/tg/active.conf;   # map $host $active_server { default tuneguesser-server-a; }
    map $arg_room $game_server {
        ~*^[A-M]  tuneguesser-server-a;
        ~*^[N-Z]  tuneguesser-server-b;
        default   $active_server;
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        # Deploy script: how many rooms each server still has (drain check)
        location ~ ^/slot/(a|b)$ {
            access_log off;
            set $slot_host tuneguesser-server-$1;
            proxy_pass http://$slot_host:3000/api/health;
            proxy_connect_timeout 2s;
        }

        # Spotify OAuth redirect lands here
        location = /callback {
            set $upstream http://$active_server:3000;
            proxy_pass $upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        }

        location /api/ {
            set $upstream http://$active_server:3000;
            proxy_pass $upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        }

        location /ws {
            set $upstream http://$game_server:3000;
            proxy_pass $upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 1h;
            proxy_send_timeout 1h;
        }

        # Hashed build assets can be cached for a long time
        location /assets/ {
            expires 30d;
            add_header Cache-Control "public, max-age=2592000, immutable";
        }

        # SPA: unknown paths fall back to index.html, never cached
        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache";
        }
    }
}
