<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0b1a" />
    <link rel="icon" type="image/png" href="/icon.png" />
    <link rel="apple-touch-icon" href="/icon.png" />
    <title>TuneGuesser</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // if the app never draws (a script error, an old browser), say so instead of showing an empty dark page
      (function () {
        var last = "";
        window.addEventListener("error", function (e) { last = e.message || String(e.error || ""); });
        window.addEventListener("unhandledrejection", function (e) { last = String(e.reason || ""); });
        setTimeout(function () {
          var r = document.getElementById("root");
          if (r && !r.children.length) {
            r.innerHTML = '<div style="padding:24px;text-align:center;color:#f4f4ff;font-family:system-ui,sans-serif"><h2>TuneGuesser could not start</h2><p style="opacity:.7;word-break:break-word"></p><p><button onclick="location.reload()" style="font-size:1.1rem;padding:12px 24px">Reload</button></p></div>';
            r.getElementsByTagName("p")[0].textContent = last || (navigator.userAgent);
          }
        }, 6000);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
